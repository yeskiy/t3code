name: Fork build

on:
  push:
    branches:
      - main
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release to yeskiy/t3code
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FORK_VERSION_BASE: "0.1.13"

jobs:
  checks:
    name: Checks for changed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch upstream main for the merge base
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none upstream main

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime
        run: vp run --filter "@t3tools/desktop" ensure:electron

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Checks for changed files
        run: vp run check:changed upstream/main --concurrency 2

  windows:
    name: Windows build
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check MSVC Spectre-mitigated libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $found = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre -property installationPath
          if (-not $found) { throw "The runner image has no MSVC Spectre-mitigated libraries. See docs/operations/development.md Windows installer prerequisites." }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Cache pnpm's Windows store directly instead of setup-vp's default cache (matches windows-tests.yml).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: fork-windows-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: vp install

      - name: Ensure Electron runtime
        run: vp run --filter "@t3tools/desktop" ensure:electron

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${FORK_VERSION_BASE}-fork.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # --wsl-runtime is omitted: fork builds do not bundle the Linux WSL backend.
      - name: Build NSIS installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: yeskiy/t3code
          # A native Windows build otherwise adds compile-cache files and fails the 80-file payload check.
          T3CODE_DESKTOP_UNTRUSTED_BUNDLE: "true"
        run: >
          vp run dist:desktop:artifact --platform win --target nsis --arch x64
          --build-version "${{ steps.version.outputs.version }}"
          --output-dir "$RUNNER_TEMP/release"

      # --wsl-runtime is omitted: fork builds do not bundle the Linux WSL backend.
      - name: Build unpacked app
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: yeskiy/t3code
          T3CODE_DESKTOP_UNTRUSTED_BUNDLE: "true"
        run: >
          vp run dist:desktop:artifact --platform win --target dir --arch x64
          --build-version "${{ steps.version.outputs.version }}"
          --output-dir "$RUNNER_TEMP/release-dir" --skip-build

      - name: Verify baked update feed config
        shell: bash
        run: |
          set -euo pipefail
          yml="$RUNNER_TEMP/release-dir/win-unpacked/resources/app-update.yml"
          test -f "$yml"
          cat "$yml"
          grep -Eq '^owner:\s*yeskiy\s*$' "$yml"
          grep -Eq '^repo:\s*t3code\s*$' "$yml"
          grep -Eq '^releaseType:\s*release\s*$' "$yml"
          if grep -Eq 'pingdotgg|^channel:\s*nightly\s*$' "$yml"; then
            echo "::error::app-update.yml points at upstream or nightly"
            exit 1
          fi

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-fork-win-x64-installer-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.blockmap
            ${{ runner.temp }}/release/latest.yml
          if-no-files-found: error

      - name: Upload unpacked app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-fork-win-x64-unpacked-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release-dir/win-unpacked
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3code-fork-win-x64-installer-${{ needs.windows.outputs.version }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          target_args=()
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            target_args=(--verify-tag)
          else
            target_args=(--target "${GITHUB_SHA}")
          fi
          gh release create "v${VERSION}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            "${target_args[@]}" \
            --title "T3 Code fork ${VERSION}" \
            --notes "Unsigned fork build of ${GITHUB_SHA}. Windows SmartScreen shows a warning on first run." \
            --latest
